definitionsText=All filters use Received Date; quarters are calendar quarters. Active pipeline includes In Progress, Submitted and On Hold. Won includes Win and Win and Completed. Win rate is won opportunities (Win and Win and Completed) divided by all opportunities in the view, whatever their status. Deleted opportunities are excluded throughout. EUR values use the displayed current indicative rates, including for historical periods; they are not historical or SAP accounting conversions. Missing values are never treated as EUR. Records without a received date remain in All received dates, but are excluded from date filters and trends.
