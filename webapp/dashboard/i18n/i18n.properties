definitionsText=Reporting quarters are calendar quarters. Won opportunities use Win/Loss Date; other opportunities use Received Date. Active pipeline includes In Progress, Submitted and On Hold. Won includes Win and Win and Completed. Win rate divides wins in the view by all opportunities matching the other filters, regardless of the Status filter. Capability and RFI opportunities are included when the Proposal type filter allows them. Deleted opportunities are excluded throughout. EUR values use the displayed current indicative rates, including for historical periods; they are not historical or SAP accounting conversions. Missing values are never treated as EUR. Won records without a Win/Loss Date are excluded from dated periods.
